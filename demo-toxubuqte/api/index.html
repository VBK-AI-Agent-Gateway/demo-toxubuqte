<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小伴 · 老人语音助手（重新开发版）</title>
<style>
:root{--red:#c8362c;--gold:#e8a81c;--navy:#142a4f;--paper:#fdfbf6;--light:#f6f3ec;--dark:#1b2a3a;--muted:#7286a0;--green:#189a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--paper);color:var(--dark);height:100dvh;display:flex;flex-direction:column}
header{background:var(--red);color:#fff;padding:20px 24px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.avatar{width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px}
header h1{font-size:26px}
header .sub{font-size:14px;color:#ffe18a}
#chat{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.bubble{max-width:88%;padding:14px 18px;border-radius:16px;font-size:19px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.xiaoban{background:var(--light);border:2px solid var(--navy);border-top-left-radius:4px;align-self:flex-start}
.user{background:var(--navy);color:#fff;border-top-right-radius:4px;align-self:flex-end}
.alert{background:#fdeaea;border:2px solid var(--red);border-top-left-radius:4px}
.inputbar{padding:14px 16px;background:#fff;border-top:2px solid #e2e7f0;display:flex;gap:10px;flex-shrink:0}
#say{flex:1;border:2px solid var(--navy);border-radius:12px;padding:12px 14px;font-size:18px;outline:none}
#send{background:var(--red);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-size:18px;font-weight:700;cursor:pointer}
.quick{padding:10px 16px 0;display:flex;gap:8px;overflow-x:auto;flex-shrink:0;background:#fff}
.quick button{white-space:nowrap;border:2px solid var(--navy);background:#fff;border-radius:99px;padding:10px 16px;font-size:15px;cursor:pointer;color:var(--dark)}
.quick button.hot{border-color:var(--red);color:var(--red)}
.speak{color:var(--muted);font-size:13px;align-self:center;margin-top:4px}
@media(max-width:640px){.bubble{font-size:17.5px}header h1{font-size:22px}}
</style>
</head>
<body>
<header>
  <div class="avatar">👵</div>
  <div><h1>小伴</h1><div class="sub">亲切的语音助手 · 慢一点 · 大白话 · 重新开发版</div></div>
</header>
<div class="quick">
  <button onclick="input('我摔了')">🚨 紧急呼救</button>
  <button onclick="input('我要去医院')">🏥 我要去医院</button>
  <button onclick="input('我想找人陪我说说话')">💬 找人陪聊</button>
  <button onclick="input('我不舒服')">🤒 打视频给儿子</button>
  <button class="hot" onclick="input('有人让我转账')">🛡️ 有人让我转账</button>
  <button onclick="input('__MIC__')">🎤 按住说话</button>
</div>
<div id="chat"></div>
<div class="inputbar">
  <input id="say" placeholder="打字，或点上面的话筒按钮">
  <button id="send" onclick="send()">发送</button>
</div>
<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const TTS="speechSynthesis" in window;
function speak(t){ if(!TTS||!t) return; const u=new SpeechSynthesisUtterance(t); u.lang="zh-CN"; u.rate=0.85; u.pitch=1.05; speechSynthesis.speak(u); }
const chat=document.getElementById("chat"),say=document.getElementById("say");
function bubble(cls,text){chat.querySelectorAll(".speak").forEach(e=>e.remove());
const d=document.createElement("div");d.className="bubble "+cls;d.textContent=text;chat.appendChild(d);
if(cls==="xiaoban"||cls==="alert"){const s=document.createElement("div");s.className="speak";s.textContent="🔊 小伴正在说";chat.appendChild(s);}chat.scrollTop=chat.scrollHeight;}
function lines(arr,alert){arr.forEach(x=>bubble(alert?"alert":"xiaoban",x));speak(arr.join(""));}
/* —— 上下文记忆 —— */
let ctx={task:null,dest:null,pickup:null};
/* —— 关键词召回 —— */
const SCAM=["转账","汇款","验证码","密码","中奖","退税","公检法","安全账户","刷单","免费领","领鸡蛋","保健品","股票","内幕"];
const EMERG=["摔了","摔倒","喘不上气","胸口疼","头晕","出血","高烧","烧得厉害","不能动了"];
const KIDS_CALL=["我不舒服","害怕","我闺女","我儿子","想我闺女","想我儿子","我一个人","孤独"];
const TAXI=["打车","去医院","去菜市场","回家","回小区","去哪","回儿子家","回闺女家"];
const KIDS=["陪","说说话","陪聊","买菜","办事","银行","视频","聊聊天","打给"];
function reply(t){
  bubble("user",t); say.value="";
  const q=t.trim();
  if(!q){lines(["我没听清，您再说一遍吧。"]);return;}
  if(EMERG.some(k=>q.includes(k))){emerg(q);return;}
  if(SCAM.some(k=>q.includes(k))){scam();return;}
  /* 上下文相关地 */
  if(ctx.task==="taxi"&&ctx.pickup==="ask"&&/(\d+|号|楼|单元|栋)/.test(q)){ctx.pickup="set";lines(["好，您就站在门口别动。","我把您的位置发给司机，","让他开到您跟前来，您不用下楼。"]);return;}
  if(ctx.task==="taxi"&&ctx.dest&&["要","行","可以","对","好","嗯","没错","是"].some(k=>q===k)){if(!ctx.pickup){ctx.pickup="ask";lines(["我再跟您核对一遍啊。","您是要去"+ctx.dest+"，对吗？","我帮您就叫辆普通的快车，还是带后备箱大一点的车？"]);return;}}
  if(TAXI.some(k=>q.includes(k))){taxi(q);return;}
  if(KIDS.some(k=>q.includes(k))){kids(q);return;}
  if(KIDS_CALL.some(k=>q.includes(k))){callKid();return;}
  lines(["我先听您说了。","您是想让我帮您叫个车，","还是找个人陪着您说说话？","实在急的话您就说：我摔了、我不舒服。"]);
}
/* —— 任务：语音打车 —— */
function taxi(q){
  ctx.task="taxi";ctx.dest=null;ctx.pickup=null;
  const m=q.match(/(市人民人民医院|市?人民医院|医院|菜市场|机场|火车站|某某小区|小区|公园|儿子家|闺女家)/);
  lines(["您今天要去哪儿呀？","说个大概地方就行。","比如某某医院，或者某某小区。"]);
  ctx.dest=prompt_dest();
  function prompt_dest(){
    const d=m?m[0]:null;if(!d){return "您想去的地方";}
    return d;
  }
  setTimeout(()=>{
    if(ctx.dest&&ctx.dest!=="您想去的地方")
      lines(["您是要去"+ctx.dest+"，对吗？","我再跟您核对一遍啊。","大概12块钱，10分钟到，您看可以吗？"]);
  },2500);
  setTimeout(()=>{
    lines(["车已经叫好了，是一辆白色的大众。"]);
    setTimeout(()=>lines(["司机姓王，车牌尾号357，","大概3分钟到您楼下。"]),1500);
  },5000);
}
/* —— 任务：共享儿女陪聊 —— */
function kids(q){
  ctx.task="kids";
  lines(["叔叔阿姨，我想帮您约个志愿者。","您想要哪种服务呢？","① 上门陪聊30分钟","② 陪同出门办事（医院、银行、菜市场）","③ 帮您给儿子或者闺女打视频"]);
  setTimeout(()=>lines(["那时间是想今天下午，还是明天上午？"]),2500);
  setTimeout(()=>{
    lines(["已经帮您约好小李了，下午3点到您家。","小李是个28岁的姑娘，","以前陪过别的爷爷奶奶去医院，您放心。"]);
  },5000);
  setTimeout(()=>lines(["小李还有1小时就到了，您先歇会儿。"]),5500);
  setTimeout(()=>lines(["今天小李陪得还顺利吗？","有哪里不满意就跟我说。"]),6000);
}
/* —— 紧急联系子女 —— */
function callKid(){
  ctx.task="kid";
  lines(["您别着急，我这就帮您给儿子打视频电话。","您现在能说话吗？"]);
  setTimeout(()=>lines(["我现在打给张伟，电话尾号6688，对吗？"]),1500);
  setTimeout(()=>lines(["儿子没接，我再给他打一次，","同时帮您联系小区物业。","您先别挂电话。"]),3500);
}
/* —— 防诈骗（最高优先级） —— */
function scam(){
  ctx.task="scam";
  lines(["叔叔，这个电话啊，您千万别信。","天底下没有免费的鸡蛋。","公检法办案，也不会让您转账。","别把钱转到陌生人的账户去。"]);
  setTimeout(()=>lines(["我现在帮您把儿子的电话拨过去。","您跟他说一声，好不好？"]),2000);
}
/* —— 紧急救助 —— */
function emerg(q){
  ctx.task="emerg";
  lines(["您别动，我马上帮您。"]);
  setTimeout(()=>lines(["您现在在家吗？在家的话，","告诉我您住几号楼几单元。"]),1200);
  setTimeout(()=>lines(["我马上帮您叫120，同时打给您儿子。","您把手机放在旁边，别挂。"]),2500);
}
/* —— 快捷按钮 —— */
function input(v){
  if(v==="__MIC__"){
    if(!SR){lines(["这台手机不能听人说话，","您打字我就看得见。"]);return;}
    const r=new SR();r.lang="zh-CN";r.interimResults=false;
    r.onresult=e=>reply(e.results[0][0].transcript);
    r.onerror=()=>lines(["我没听清，您再说一遍吧。"]);
    try{r.start();bubble("xiaoban","小伴在听着……您说吧。");}catch(e){}
    return;
  }
  say.value=v; send();
}
function send(){reply(say.value)}
say.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
/* —— 3秒未回应 → 重复 —— */
setInterval(()=>{ if(TTS&&!speechSynthesis.speaking&&document.hidden!==true){ /* idle检测占位 */ } },5000);
lines(["叔叔，我是小伴，您有事儿随时跟我说。","您想打车、找人陪着说说话，还是有别的要帮忙的？"]);
</script>
</body>
</html>
