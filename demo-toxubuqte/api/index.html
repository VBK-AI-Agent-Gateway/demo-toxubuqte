<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小伴 · 老人语音助手</title>
<style>
:root{--red:#c8362c;--gold:#e8a81c;--navy:#142a4f;--paper:#fdfbf6;--light:#f6f3ec;--dark:#1b2a3a;--muted:#7286a0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--paper);color:var(--dark);height:100dvh;display:flex;flex-direction:column}
header{background:var(--red);color:#fff;padding:20px 24px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.avatar{width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px}
header h1{font-size:26px}
header .sub{font-size:14px;color:#ffe18a}
#chat{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.bubble{max-width:86%;padding:14px 18px;border-radius:16px;font-size:19px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.xiaoban{background:var(--light);border:2px solid var(--navy);border-top-left-radius:4px;align-self:flex-start}
.user{background:var(--navy);color:#fff;border-top-right-radius:4px;align-self:flex-end}
.inputbar{padding:14px 16px;background:#fff;border-top:2px solid #e2e7f0;display:flex;gap:10px;flex-shrink:0}
#say{flex:1;border:2px solid var(--navy);border-radius:12px;padding:12px 14px;font-size:18px;outline:none}
#send{background:var(--red);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-size:18px;font-weight:700;cursor:pointer}
.quick{padding:10px 16px 0;display:flex;gap:8px;overflow-x:auto;flex-shrink:0;background:#fff}
.quick button{white-space:nowrap;border:2px solid var(--navy);background:#fff;border-radius:99px;padding:10px 16px;font-size:15px;cursor:pointer;color:var(--dark)}
.quick button.hot{border-color:var(--red);color:var(--red)}
.speak{color:var(--muted);font-size:13px;align-self:center;margin-top:4px}
@media(max-width:640px){.bubble{font-size:17.5px}header h1{font-size:22px}}
</style>
</head>
<body>
<header>
  <div class="avatar">👵</div>
  <div><h1>小伴</h1><div class="sub">亲切的语音助手 · 慢一点 · 大白话</div></div>
</header>
<div class="quick">
  <button onclick="input('我摔了')">🚨 紧急呼救</button>
  <button onclick="input('我想去医院')">🏥 我要去医院</button>
  <button onclick="input('我想找人陪我说说话')">💬 找人陪聊</button>
  <button onclick="input('我不舒服')">🤒 打视频给儿子</button>
  <button class="hot" onclick="input('有人让我转账')">🛡️ 有人让我转账</button>
  <button onclick="input('')">🎤 按住说话（浏览器语音识别）</button>
</div>
<div id="chat"></div>
<div class="inputbar">
  <input id="say" placeholder="在这儿打字，或者用上面的按钮">
  <button id="send" onclick="send()">发送</button>
</div>
<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const TTS="speechSynthesis" in window;
function speak(t){ if(!TTS) return; const u=new SpeechSynthesisUtterance(t); u.lang="zh-CN"; u.rate=0.85; u.pitch=1.05; speechSynthesis.speak(u); }
const chat=document.getElementById("chat"),say=document.getElementById("say");
function bubble(cls,text){chat.querySelectorAll(".speak").forEach(e=>e.remove());
const d=document.createElement("div");d.className="bubble "+cls;d.textContent=text;chat.appendChild(d);
if(cls==="xiaoban"){const s=document.createElement("div");s.className="speak";s.textContent="🔊 小伴正在说";chat.appendChild(s);}chat.scrollTop=chat.scrollHeight;}
function lines(arr){arr.forEach(x=>bubble("xiaoban",x))}

/* 防诈骗关键词（最高优先级） */
const SCAM=["转账","汇款","验证码","密码","中奖","退税","公检法","安全账户","刷单","免费领","领鸡蛋","保健品","股票","内幕"];
/* 紧急 */
const EMERG=["摔了","摔倒","喘不上气","胸口疼","头晕","出血","发高烧","烧得厉害"];
/* 紧急联系 */
const KIDS=["我不舒服","害怕","我闺女","我儿子","找我儿子","找我闺女","想我儿子","想我闺女","孤独","我一个人"];
function reply(t){
  bubble("user",t); say.value="";
  const q=t.trim();
  if(!q){lines(["我没听清，您再说一遍？","按住下面的小话筒就行。"]);return;}
  if(EMERG.some(k=>q.includes(k))){slide("emerg",q);return;}
  if(SCAM.some(k=>q.includes(k))){slide("scam",q);return;}
  if(["打车","去医院","去菜市场","回家","回小区","去哪","去某某"].some(k=>q.includes(k))){slide("taxi",q);return;}
  if(["陪","说说话","陪聊","买菜","办事","银行","视频","聊聊天"].some(k=>q.includes(k))){slide("kids",q);return;}
  lines(["我先听您说了","您是想打车去个地方，","还是想找个人陪着您说说话？"]);
}
/* 任务对话机 */
function slide(kind,q){
  if(kind==="scam"){
    lines(["叔叔，这个电话您千万可别信。","天底下没有免费的鸡蛋，公检法也不会让您转账。","我马上帮您把儿子的电话拨过去，您把情况跟他说一说，好不好？"]);
  }else if(kind==="emerg"){
    lines(["您先别动，地方受伤也好疼。","您现在在家吗？","在家的话，告诉我您住几号楼几单元。","我马上帮您叫救护车，再把儿子叫过来。您把手机放在旁边，别挂。"]);speak("别慌，告诉我几号楼，我马上叫120来。");
    const idx=demo("几号楼");
  }else if(kind==="kids"){
    lines(["阿姨，您别担心，我都听着呢。","我帮您约个志愿者上门陪您，或者现在就帮您打给儿子视频，您想哪个？","也可以帮忙去买菜、陪去医院调手机没问题。"]);
  }else{
    lines(["叔叔，想吃个饭、看医生还是买菜？","我是想请您告诉我，您今天要去哪儿？","您去菜市场，还是去医院？说个大概就行。"]);speak("");
    const idx=demo("");
  }
}
function demo(q){/*占位*/}
function input(v){say.value=v;}
function send(){reply(say.value);}
say.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
/* 浏览器语音识别 */
document.querySelectorAll(".quick button").forEach(b=>{if(!b.textContent.includes("话筒"))return;
b.onclick=()=>{ if(!SR){bubble("xiaoban","这台手机不支持听人说话，您打字我就看得见。");return;}
const r=new SR();r.lang="zh-CN";r.interimResults=false;
r.onstart=()=>bubble("speak","小伴在听着…");
r.onresult=e=>{const t=e.results[0][0].transcript;reply(t)};
r.onerror=()=>bubble("xiaoban","我没听清，您再说一遍吧。");
r.start();};
});
lines(["叔叔，我是小伴，您有事儿随时跟我说。","您想打车、找人陪着说说话，还是有别的要帮忙的？"]);
</script>
</body>
</html>
